<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048 Game</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #faf8ef;
    }

    h1 {
        margin-top: 20px;
    }

    .container {
        width: 330px;
        margin: auto;
    }

    .score-container {
        margin: 10px;
        font-size: 18px;
    }

    #game-board {
        display: grid;
        grid-template-columns: repeat(4, 70px);
        grid-gap: 10px;
        background: #bbada0;
        padding: 10px;
        border-radius: 5px;
    }

    .tile {
        width: 70px;
        height: 70px;
        background: #cdc1b4;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        border-radius: 5px;
    }

    .tile[data-value="2"] { background: #eee4da; }
    .tile[data-value="4"] { background: #ede0c8; }
    .tile[data-value="8"] { background: #f2b179; }
    .tile[data-value="16"] { background: #f59563; }
    .tile[data-value="32"] { background: #f67c5f; }
    .tile[data-value="64"] { background: #f65e3b; }
    .tile[data-value="128"] { background: #edcf72; }
    .tile[data-value="256"] { background: #edcc61; }
    .tile[data-value="512"] { background: #edc850; }
    .tile[data-value="1024"] { background: #edc53f; }
    .tile[data-value="2048"] { background: #edc22e; }
</style>
</head>

<body>

<div class="container">
    <h1>2048</h1>
    <div class="score-container">
        Score: <span id="score">0</span>
    </div>
    <button onclick="restartGame()">Restart</button>
    <div id="game-board"></div>
</div>

<script>
let board = [];
let score = 0;

const boardElement = document.getElementById("game-board");
const scoreElement = document.getElementById("score");

function init() {
    board = Array(4).fill().map(() => Array(4).fill(0));
    score = 0;
    addTile();
    addTile();
    draw();
}

function addTile() {
    let empty = [];
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (board[r][c] === 0) empty.push({r, c});
        }
    }

    if (empty.length === 0) return;

    let {r, c} = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function draw() {
    boardElement.innerHTML = "";
    scoreElement.textContent = score;

    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            let tile = document.createElement("div");
            tile.className = "tile";
            tile.textContent = board[r][c] || "";
            tile.dataset.value = board[r][c];
            boardElement.appendChild(tile);
        }
    }
}

function slide(row) {
    row = row.filter(val => val);
    
    for (let i = 0; i < row.length - 1; i++) {
        if (row[i] === row[i + 1]) {
            row[i] *= 2;
            score += row[i];
            row[i + 1] = 0;
        }
    }

    row = row.filter(val => val);

    while (row.length < 4) row.push(0);

    return row;
}

function rotateBoard() {
    let newBoard = Array(4).fill().map(() => Array(4).fill(0));
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            newBoard[c][3 - r] = board[r][c];
        }
    }
    board = newBoard;
}

function move(direction) {
    let oldBoard = JSON.stringify(board);

    for (let i = 0; i < direction; i++) rotateBoard();

    for (let r = 0; r < 4; r++) {
        board[r] = slide(board[r]);
    }

    for (let i = 0; i < (4 - direction) % 4; i++) rotateBoard();

    if (JSON.stringify(board) !== oldBoard) {
        addTile();
        draw();
    }
}
function restartGame() {
    init();
}


document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") move(0);
    if (e.key === "ArrowUp") move(3);   // swapped
    if (e.key === "ArrowRight") move(2);
    if (e.key === "ArrowDown") move(1); // swapped
});

init();
</script>

</body>
</html>
